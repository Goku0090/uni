services:
  - type: web
    name: unisync
    runtime: python
    runtimeVersion: 3.12.0
    buildCommand: bash build.sh
    startCommand: cd auth_project && gunicorn auth_project.wsgi:application --workers 3 --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PIP_DEFAULT_TIMEOUT
        value: "600"
      - key: PIP_NO_CACHE_DIR
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
