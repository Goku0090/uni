services:
  - type: web
    name: unisync
    runtime: python
    runtimeVersion: 3.12.0
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn auth_project.wsgi:application --workers 3 --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PIP_DEFAULT_TIMEOUT
        value: "600"
      - key: PYTHONUNBUFFERED
        value: "1"
