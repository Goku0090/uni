name: Code Quality Checks

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort pylint
    
    - name: Run flake8
      run: |
        # Stop the build if there are Python syntax errors
        flake8 auth_project --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 auth_project --count --exit-zero --max-complexity=10 --statistics
    
    - name: Check black formatting
      run: black --check auth_project --line-length=100
    
    - name: Check import sorting
      run: isort --check-only --profile black auth_project
    
    - name: Run pylint
      run: |
        pylint auth_project/accounts/models.py --disable=all --enable=E,F --exit-zero
      continue-on-error: true
